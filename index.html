<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barrel to Pier">
  <meta name="theme-color" content="#86accc">
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mOcvfzufwAIdgNgqjwcmwAAAABJRU5ErkJggg==">
  <title>Barrel to Pier</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #86accc; color: #1c2a40; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; -webkit-user-select: none; user-select: none; }
    #box { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .title { font-size: 28px; letter-spacing: 0.06em; margin-bottom: 18px; }
    .text { font-size: 16px; max-width: 90%; }
    button { margin-top: 18px; font-size: 18px; padding: 10px 22px; border: 0; border-radius: 22px; background: #345f95; color: #fff; display: none; }
  </style>
</head>
<body>
  <div id="box">
    <div class="title">Barrel to Pier</div>
    <div class="text" id="msg">読み込み中…</div>
    <button id="retry">再読み込み</button>
  </div>
  <script>
    // 起動用ページ：どの版を開くかを決めて、v/<版>/index.html へ移るだけ（小さく、ほとんど変わらない）。
    // 版のフォルダは、公開後に中身が変わらない。だから、古いキャッシュの index.html と新しい wasm が混ざることがない。
    (function () {
      var msg = document.getElementById("msg"), retry = document.getElementById("retry");
      var heal = /[?&]heal=1(&|$)/.test(location.search);
      // 言語：?lang=ja / ?lang=en があれば、それ（版のページへ引き継ぐ）。なければ、ブラウザの言語が ja で始まれば日本語、それ以外は英語
      var langQ = (/[?&]lang=(ja|en)(&|#|$)/i.exec(location.search) || [])[1];
      var nav = "";
      try { nav = String(navigator.language || (navigator.languages && navigator.languages[0]) || ""); } catch (e) {}
      var lang = langQ ? langQ.toLowerCase() : (/^ja([-_]|$)/i.test(nav) ? "ja" : "en");
      var MSG = lang === "ja"
        ? { loading: "読み込み中…", fail: "通信を確認して、もう一度開いてください。", reload: "再読み込み" }
        : { loading: "Loading…", fail: "Check your connection and open it again.", reload: "Reload" };
      try { document.documentElement.lang = lang; msg.textContent = MSG.loading; retry.textContent = MSG.reload; } catch (e) {}
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      function go(id) {
        if (!/^[0-9A-Za-z_-]+$/.test(id)) return fail();
        set("bt.lastBuild", id);
        var q = [];
        if (heal) q.push("r=" + Date.now());
        if (langQ) q.push("lang=" + langQ.toLowerCase());
        location.replace("v/" + id + "/index.html" + (q.length ? "?" + q.join("&") : ""));
      }
      function fail() {
        msg.textContent = MSG.fail;
        retry.style.display = "inline-block";
        retry.onclick = function () { location.replace(location.pathname + (langQ ? "?lang=" + langQ.toLowerCase() : "")); };
      }
      // ゲームから切り替えるとき（?to=<版>）：準備が済んだ版へ、そのまま入る（version.json を見ない。古い version.json で、元の版へ戻る繰り返しを防ぐ）
      var to = (/[?&]to=([0-9A-Za-z_-]+)/.exec(location.search) || [])[1];
      if (to) { go(to); return; }
      // SW 経由でなくても、ネットワークだけを見る（cache は no-store。自己修復のときは reload）
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); }, 3000);
      fetch("version.json?t=" + Date.now(), { cache: heal ? "reload" : "no-store", signal: ctl.signal })
        .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
        .then(function (j) {
          clearTimeout(timer);
          if (!j || !j.buildId) throw new Error("no id");
          var id = String(j.buildId), last = get("bt.lastBuild");
          // 公開の直後は、version.json が古いまま返ることがある（Pages の CDN）。前回の版のほうが新しければ、そちらへ（版の ID は時刻で始まる）
          if (last && /^[0-9A-Za-z_-]+$/.test(last) && last > id) id = last;
          go(id);
        })
        .catch(function () {
          clearTimeout(timer);
          // 取れない（オフラインなど）：オフライン用に保存済みの版、なければ、前回の版
          var id = get("bt.cachedBuild") || get("bt.lastBuild");
          if (id) go(id); else fail();
        });
      // サービスワーカー（オフライン用）。登録の失敗は、静かにあきらめる
      if ("serviceWorker" in navigator) {
        try { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () {}); } catch (e) {}
      }
    })();
  </script>
</body>
</html>
