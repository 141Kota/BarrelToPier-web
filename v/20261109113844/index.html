<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- 拡大の禁止・ノッチの下まで広げる（viewport-fit=cover）。余白（セーフエリア）は、ゲームが env(safe-area-inset-*) を読んで取る -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- 公開の構成では、このページは v/<版>/ の中。マニフェストとアイコンは、ルートのものを使う（ローカルの確認用ビルドでは、見つからなくてよい） -->
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icon-180.png">
  <!-- ホーム画面に追加したとき、全画面で開く -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barrel to Pier">
  <meta name="theme-color" content="#86accc">
  <meta name="format-detection" content="telephone=no">
  <!-- favicon.ico の 404 を出さない（小さな画像を直接指定） -->
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mOcvfzufwAIdgNgqjwcmwAAAABJRU5ErkJggg==">
  <title>Barrel to Pier</title>
  <style>
    /* 背景の色は、ゲームの海（昼の背景のグラデーション）に近づける */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #86accc;
      /* 引っ張って更新の禁止、拡大・長押し・ダブルタップの動きの禁止 */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    /* キャンバスは画面全体（ノッチ・ホームバーの裏も描く）。余白（セーフエリア）は、ゲーム側が env() の値を受け取って取る */
    #unity-container {
      position: fixed; left: 0; top: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh; height: -webkit-fill-available; height: 100dvh;
      background: #86accc;
      padding: 0; box-sizing: border-box;
    }
    #unity-canvas {
      position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%;
      background: transparent;
      touch-action: none;
      outline: none;
    }
    #unity-loading {
      position: fixed; left: 0; right: 0; top: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #1c2a40; text-align: center; pointer-events: none;
    }
    #unity-loading .title { font-size: 28px; letter-spacing: 0.06em; margin-bottom: 18px; }
    #unity-loading .bar { width: min(60vw, 360px); height: 10px; border-radius: 5px; background: rgba(28, 42, 64, 0.2); overflow: hidden; }
    #unity-loading .fill { width: 0%; height: 100%; background: #345f95; transition: width 0.2s; }
    #unity-loading .text { margin-top: 12px; font-size: 16px; }
    #unity-warning {
      position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
      background: #fff; color: #7a1010; padding: 8px 14px; border-radius: 6px; display: none; font-size: 14px; z-index: 10;
    }
    /* 縦向きのときの「横にしてください」：ゲームの読み込みを待たず、ページが即座に出す（JS が html に portrait を付ける） */
    #rotate-cover {
      position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 2147483647;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      box-sizing: border-box; background: #86accc; color: #1c2a40; text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      touch-action: none;
    }
    html.portrait #rotate-cover { display: flex; }
    html.portrait #unity-canvas { pointer-events: none; }
    #rotate-cover svg { width: 72px; height: 72px; animation: rotate-phone 2.4s ease-in-out infinite; }
    #rotate-cover p {
      margin: 0; max-width: 80vw; font-size: clamp(16px, 5vw, 28px); line-height: 1.4;
      overflow-wrap: anywhere; text-wrap: balance;
    }
    @keyframes rotate-phone { 0%, 15% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
    #debug-log {
      position: fixed; left: 4px; bottom: 4px; width: 40%; max-width: 360px; max-height: 6.5em; overflow: hidden; z-index: 20; display: none;
      margin: 0; padding: 2px 4px; background: rgba(0, 0, 0, 0.45); color: #d6e6f5; border-radius: 4px;
      font: 10px/1.3 monospace; white-space: pre-wrap; word-break: break-all; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="unity-loading">
    <div class="title">Barrel to Pier</div>
    <div class="bar"><div class="fill" id="unity-fill"></div></div>
    <div class="text" id="unity-text">読み込み中… 0%</div>
  </div>
  <div id="rotate-cover" role="alert">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="4" width="20" height="40" rx="4" fill="#1c2a40"/><rect x="17" y="10" width="14" height="26" rx="1" fill="#86accc"/></svg>
    <p>スマホを、横にしてください</p>
  </div>
  <div id="unity-warning"></div>
  <pre id="debug-log"></pre>

  <script>
    // ログの集め（常に動く）。エラーは「詳しい情報」に貯める（画面には出さない。「詳しい情報をコピー」で取り出す）。
    // index.html?debug=1 のときだけ、画面の下にログ欄（同じ文は「（同じ文が n 回）」にまとめ、スタックは 1 行に折りたたみ、最初のエラーを上に残す）
    window.btDetails = [];
    window.btStartFailed = null;   // 起動の失敗を知らせる関数（あとで入る）
    (function () {
      var el = document.getElementById("debug-log");
      var debug = /[?&]debug=1(&|$)/.test(location.search);
      if (debug) el.style.display = "block";
      var lines = [], first = null;
      function text(args) {
        return Array.prototype.map.call(args, function (a) {
          try { return typeof a === "string" ? a : (a && a.stack) || JSON.stringify(a); } catch (e) { return String(a); }
        }).join(" ");
      }
      function add(kind, args) {
        var s = text(args);
        if (kind === "[E]" && window.btDetails.length < 60) window.btDetails.push(s.slice(0, 1500));
        if (!debug) return;
        s = s.replace(/\s*\n\s*/g, " ⏎ ");
        if (s.length > 220) s = s.slice(0, 220) + "…";
        if (kind === "[E]" && first === null) first = "★最初のエラー " + s;
        var last = lines.length ? lines[lines.length - 1] : null;
        if (last && last.k === kind && last.s === s) last.n++;
        else { lines.push({ k: kind, s: s, n: 1 }); if (lines.length > 5) lines.shift(); }
        el.textContent = (first !== null ? first + "\n" : "") + lines.map(function (l) { return l.k + " " + l.s + (l.n > 1 ? "（同じ文が " + l.n + " 回）" : ""); }).join("\n");
        el.scrollTop = el.scrollHeight;
      }
      ["log", "error"].forEach(function (k) {
        var orig = console[k];
        console[k] = function () { add(k === "error" ? "[E]" : "[L]", arguments); orig.apply(console, arguments); };
      });
      window.addEventListener("error", function (e) {
        add("[E]", [(e.message || "error") + " (" + (e.filename || "") + ":" + (e.lineno || 0) + ")"]);
        if (window.btStartFailed) window.btStartFailed();
      });
      window.addEventListener("unhandledrejection", function (e) {
        add("[E]", ["未処理: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)]);
        if (window.btStartFailed) window.btStartFailed();
      });
      window.debugLogAdd = add;
    })();
  </script>
  <script>
    // ダブルタップの拡大・ピンチ・長押しの選択や、右クリックのメニューを止める（Safari は、touch-action だけでは止まらないことがある）
    (function () {
      var lastEnd = 0;
      document.addEventListener("touchend", function (e) {
        var now = Date.now();
        if (now - lastEnd < 350) e.preventDefault();
        lastEnd = now;
      }, { passive: false });
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
        document.addEventListener(name, function (e) { e.preventDefault(); });
      });
      document.addEventListener("touchmove", function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("selectstart", function (e) { e.preventDefault(); });
    })();

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var fill = document.querySelector("#unity-fill");
    var text = document.querySelector("#unity-text");
    var warning = document.querySelector("#unity-warning");

    // ビルド ID（ビルドのたびに、WebGLBuild が "20261108065927" を置き換える。置き換わっていなければ、自動更新は使わない）。
    // 公開の構成：このページは <ルート>/v/<ID>/index.html。版のフォルダは公開後に変わらないので、Build の URL に ?v= は要らない。
    window.BUILD_ID = "20261109113844";
    var HAS_BUILD_ID = !/^__/.test(window.BUILD_ID);
    var PUBLISHED = HAS_BUILD_ID && /\/v\/[^\/]+\/[^\/]*$/.test(location.pathname);
    var ROOT_URL = PUBLISHED ? new URL("../../", location.href).href : null;
    var rParam = (/[?&]r=(\d+)/.exec(location.search) || [])[1];
    var vq = rParam ? "?r=" + rParam : "";   // 自己修復のあとだけ：Build の各ファイルを、新しく取り直す

    // ---- 起動の失敗：画面には、短い案内と「再読み込み」だけ（スタックは出さない）。自己修復は 1 回だけ ----
    var bootDone = false, fatalShown = false;
    function btCopy(t) {
      function fb() { try { var ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); } catch (e) {} }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb();
    }
    function goRoot(heal) {
      var base = ROOT_URL || (location.pathname);
      location.replace(ROOT_URL ? ROOT_URL + (heal ? "?heal=1" : "") : base + "?v=" + Date.now());
    }
    function showFailBox(reason) {
      var box = document.createElement("div");
      box.style.cssText = "position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#86accc;color:#1c2a40;text-align:center;padding:24px;box-sizing:border-box";
      var msg = document.createElement("div");
      msg.style.cssText = "font-size:20px;margin-bottom:8px";
      msg.textContent = "うまく起動できませんでした";
      var sub = document.createElement("div");
      sub.style.cssText = "font-size:14px;opacity:0.85;margin-bottom:18px;max-width:90%";
      sub.textContent = (reason || "通信を確認して、もう一度開いてください。") + "セーブのデータは、消えていません。";
      var b = document.createElement("button");
      b.textContent = "再読み込み";
      b.style.cssText = "font-size:18px;padding:10px 22px;border:0;border-radius:22px;background:#345f95;color:#fff";
      b.onclick = function () { try { sessionStorage.removeItem("bt.healed"); } catch (e) {} goRoot(true); };
      var c = document.createElement("button");
      c.textContent = "詳しい情報をコピー";
      c.style.cssText = "margin-top:16px;font-size:12px;padding:6px 14px;border:0;border-radius:14px;background:rgba(28,42,64,0.15);color:#1c2a40";
      c.onclick = function () { btCopy("build=" + window.BUILD_ID + "\n" + window.btDetails.join("\n")); c.textContent = "コピーしました"; };
      box.appendChild(msg); box.appendChild(sub); box.appendChild(b); box.appendChild(c);
      document.body.appendChild(box);
    }
    // 起動の失敗（最初のフレームの前）：1 回だけ、この版のキャッシュを消して、起動用ページから入り直す。2 回目は、案内だけ
    function startFailed(reason, always) {
      if (fatalShown) return;
      if ((bootDone || window.btFirstFrame) && !always) return;   // 最初の画面（タイトル）まで来たあとの例外は、起動の失敗ではない
      fatalShown = true;
      var healed = false;
      try { healed = sessionStorage.getItem("bt.healed") === "1"; } catch (e) { healed = true; }
      var debugMode = /[?&]debug=1(&|$)/.test(location.search);   // ?debug=1 のときは、自動で読み直さず、案内を出す（原因を見られるように）
      if (!bootDone && !window.btFirstFrame && !healed && ROOT_URL && !debugMode) {
        try { sessionStorage.setItem("bt.healed", "1"); } catch (e) {}
        text.textContent = "読み込み直しています…";
        var go = function () { goRoot(true); };
        try {
          if (window.caches) caches.delete("bt-" + window.BUILD_ID).then(go, go); else go();
          setTimeout(go, 1500);
        } catch (e) { go(); }
        return;
      }
      showFailBox(reason);
    }
    window.btStartFailed = function () { startFailed(); };
    // 起動に成功したら、自己修復の印を消す（次に問題が起きたら、また 1 回できる）
    function clearFatalMark() { try { sessionStorage.removeItem("bt.healed"); } catch (e) {} }

    function showMessage(msg) {
      warning.textContent = msg;
      warning.style.display = "block";
      setTimeout(function () { warning.style.display = "none"; }, 6000);
    }
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js" + vq;
    var config = {
      dataUrl: buildUrl + "/WebGL.data" + vq,
      frameworkUrl: buildUrl + "/WebGL.framework.js" + vq,
      codeUrl: buildUrl + "/WebGL.wasm" + vq,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "BarrelToPier",
      productVersion: "1.0",
      // Unity の通知：通常は画面に出さない（詳しい情報に貯める）。?debug=1 のときだけ出す
      showBanner: function (msg, type) {
        if (type === "error") console.error(String(msg));
        if (/[?&]debug=1(&|$)/.test(location.search)) showMessage(String(msg).slice(0, 200));
      },
      // 致命的なエラー：Unity の既定（スタックトレースの警告）を出さず、短い案内に置き換える（true を返すと、既定は出ない）
      errorHandler: function (message, filename, lineno) { console.error("fatal: " + message); startFailed(null, true); return true; },
      // 描く画素数を減らす（軽くするため）。短辺が 720 画素までになる倍率（大きい画面は 1 より小さくなり、少しぼやける）。
      // 上限は、端末の倍率（iPhone は 3 倍）と 2、下限は 0.5。画面の大きさを変えても、倍率は起動時のまま
      devicePixelRatio: Math.max(0.5, Math.min(window.devicePixelRatio || 1, 2, 720 / Math.max(1, Math.min(window.innerWidth, window.innerHeight)))),
    };

    // 画面の回転・アドレスバーの出入りで、キャンバスの大きさを追従させる（CSS の 100% は自動で追従するが、描画の画素数は Unity が resize で更新する。念のため通知する）
    // ゲーム（C#）は、キャンバスの大きさ・セーフエリア・devicePixelRatio を、0.1〜0.25 秒ごとに、ここから読み直す（BarrelBridge.jslib）。
    // ここでは、変化の合図（resize）を出し、起動から 3 秒は、100 ms ごとに、値を見て、変わっていれば、合図を出す
    function notifyResize() { window.dispatchEvent(new Event("resize")); }
    function envKey() {
      var inset = "";
      try {
        var el = document.createElement("div");
        el.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
        document.body.appendChild(el);
        var cs = window.getComputedStyle(el);
        inset = [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(",");
        document.body.removeChild(el);
      } catch (e) {}
      return [window.innerWidth, window.innerHeight, canvas.clientWidth, canvas.clientHeight, window.devicePixelRatio, inset].join("|");
    }
    var lastEnv = "";
    function checkEnv() {
      var k = envKey();
      if (k !== lastEnv) { lastEnv = k; notifyResize(); }
    }
    ["resize", "pageshow", "visibilitychange"].forEach(function (n) { window.addEventListener(n, checkEnv); });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { checkEnv(); notifyResize(); });
    window.addEventListener("orientationchange", function () { setTimeout(notifyResize, 150); checkEnv(); });
    (function () {
      var t0 = Date.now();
      var id = setInterval(function () { checkEnv(); if (Date.now() - t0 > 3000) clearInterval(id); }, 100);
    })();

    // ---- 画面の回転：縦向きの覆い（即時）と、値が安定してからの、配置の作り直し ----
    // 覆いは matchMedia('(orientation: portrait)') の change（即時）で切り替える（resize・orientationchange は予備）。タッチ端末だけ。
    // 縦のあいだはキャンバスへの入力を止め（CSS）、Unity に一時停止（OnBrowserPaused "1"）を知らせる。横に戻ったら再開（"0"）。
    // 回転・サイズ変更のあと、50 ms ごとに大きさ・セーフエリア・dpr を読み、連続 6 回同じ、または 2 秒で確定し、確定した値（点）を Unity に渡す
    // （Unity は配置をすべて作り直す）。確定の 0.5 秒後に、Unity が、もう一度作り直す（何度でも同じ結果）。
    (function () {
      var root = document.documentElement;
      var hasTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;
      var mq = window.matchMedia ? window.matchMedia("(orientation: portrait)") : null;
      var pausedSent = null, pending = [];
      function send(method, arg) {
        var u = window.unityInstance;
        if (!u) { pending = pending.filter(function (p) { return p[0] !== method; }); pending.push([method, arg]); return; }
        try { u.SendMessage("BarrelEnvReceiver", method, arg); } catch (e) {}
      }
      window.flushPendingUnityMessages = function () { var q = pending; pending = []; q.forEach(function (p) { send(p[0], p[1]); }); startSettle(); };
      function isPortrait() { return mq ? mq.matches : window.innerHeight > window.innerWidth; }
      function updateCover() {
        var p = hasTouch && isPortrait();
        root.classList.toggle("portrait", p);
        if (pausedSent !== p) { pausedSent = p; send("OnBrowserPaused", p ? "1" : "0"); }
      }
      function insets() {
        var out = [];
        ["left", "top", "right", "bottom"].forEach(function (n) {
          var v = 0;
          try {
            var el = document.createElement("div");
            el.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-" + n + ":env(safe-area-inset-" + n + ")";
            document.body.appendChild(el);
            v = parseFloat(window.getComputedStyle(el)["padding" + n.charAt(0).toUpperCase() + n.slice(1)]) || 0;
            document.body.removeChild(el);
          } catch (e) {}
          out.push(v);
        });
        return out;
      }
      function sample() {
        var vv = window.visualViewport;
        var w = canvas.clientWidth || (vv && vv.width) || window.innerWidth, h = canvas.clientHeight || (vv && vv.height) || window.innerHeight;
        return [w, h, window.devicePixelRatio || 1].concat(insets());
      }
      function same(a, b) {
        for (var i = 0; i < a.length; i++) if (Math.abs(a[i] - b[i]) >= (i === 2 ? 0.01 : 0.5)) return false;
        return true;
      }
      var timer = null;
      function startSettle() {
        if (timer) clearInterval(timer);
        var last = null, count = 0, t0 = Date.now();
        timer = setInterval(function () {
          var s = sample();
          if (last && same(s, last)) count++; else { count = 1; last = s; }
          if (count >= 6 || Date.now() - t0 >= 2000) {
            clearInterval(timer); timer = null;
            if (isPortrait() && hasTouch) return;   // 縦のあいだは、配置しない（横に戻ったときに、また確定する）
            send("OnScreenSettled", last.join(","));
          }
        }, 50);
      }
      function onChange() { updateCover(); startSettle(); }
      if (mq) { if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange); }
      window.addEventListener("resize", onChange);
      window.addEventListener("orientationchange", onChange);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", onChange);
      updateCover();
    })();

    // ---- サービスワーカー：版のファイルの保存（オフライン用）と、新しい版の背景での準備 ----
    // 知らせ（画面の下の隅。小さな表示だけ）
    var toastTimer = null;
    function toast(msg) {
      var d = document.getElementById("bt-toast");
      if (!d) {
        d = document.createElement("div"); d.id = "bt-toast";
        d.style.cssText = "position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(28,42,64,0.8);color:#fff;padding:5px 14px;border-radius:14px;font-size:13px;pointer-events:none;transition:opacity .4s";
        document.body.appendChild(d);
      }
      d.textContent = msg; d.style.opacity = "1";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { d.style.opacity = "0"; }, 4000);
    }
    var pendingId = null;       // 準備が終わった、新しい版
    var wantedId = null;        // 準備を頼んだ、新しい版
    function askPrecache(id) {
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.ready.then(function (reg) {
        var sw = reg.active || navigator.serviceWorker.controller;
        if (sw) sw.postMessage({ type: "precache", id: id });
      }).catch(function () {});
    }
    if ("serviceWorker" in navigator && PUBLISHED) {
      navigator.serviceWorker.addEventListener("message", function (e) {
        var m = e.data || {};
        if (m.type !== "precache-done") return;
        if (m.id === window.BUILD_ID) {
          if (m.ok) { try { localStorage.setItem("bt.cachedBuild", m.id); } catch (x) {} toast("オフラインで遊べます"); }
          else toast("オフラインの準備ができませんでした");
        } else if (m.id === wantedId && m.ok) {
          pendingId = m.id;
          trySwitch();
        }
      });
    }
    // 起動に成功したら、この版を保存する（初回だけ時間がかかる。遊びを邪魔しない）
    function startOfflineSave() {
      if (!PUBLISHED || !("serviceWorker" in navigator)) return;
      var done = false;
      try { done = localStorage.getItem("bt.cachedBuild") === window.BUILD_ID; } catch (e) {}
      if (!done) askPrecache(window.BUILD_ID);
    }

    // ---- 新しい版：戻ったとき（visible、pageshow）に version.json（キャッシュなし）を確認。あれば、背景で保存。切り替えは、安全なとき（タイトルが手前）だけ ----
    function trySwitch() {
      if (!pendingId || !window.btSafeToUpdate || document.visibilityState !== "visible") return;
      var id = pendingId;
      pendingId = null;
      var go = function () { location.replace(ROOT_URL + "?to=" + encodeURIComponent(id)); };
      try {
        // セーブを確実に書き込む（IndexedDB へ）。終わらなくても、1 秒で進む
        var done = false, once = function () { if (!done) { done = true; go(); } };
        setTimeout(once, 1000);
        if (window.barrelSyncFiles) window.barrelSyncFiles(once);
        else once();
      } catch (e) { go(); }
    }
    window.btOnSafe = trySwitch;
    function checkVersion() {
      if (!PUBLISHED) { return; }
      fetch(ROOT_URL + "version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var id = j && j.buildId;
          if (!id || id <= window.BUILD_ID) return;   // 古い version.json（公開直後の CDN）では、戻らない（ID は時刻で始まる）
          if (id === pendingId) { trySwitch(); return; }
          if (id === wantedId) return;
          wantedId = id;
          if ("serviceWorker" in navigator && navigator.serviceWorker.controller) askPrecache(id);
          else { pendingId = id; trySwitch(); }   // サービスワーカーが使えない：準備なしで切り替える（起動用ページが、新しい版を取る）
        })
        .catch(function () {});
    }
    window.addEventListener("pageshow", checkVersion);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") { checkVersion(); trySwitch(); }
    });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onerror = function () {
      console.error("loader not found: " + loaderUrl);
      startFailed("通信を確認して、もう一度開いてください。");
    };
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var percent = Math.round(progress * 100);
        fill.style.width = percent + "%";
        text.textContent = percent >= 100 ? "起動中…" : "読み込み中… " + percent + "%";
      }).then(function (unityInstance) {
        loading.style.display = "none";
        bootDone = true;
        clearFatalMark();
        window.unityInstance = unityInstance;
        if (window.flushPendingUnityMessages) window.flushPendingUnityMessages();
        setTimeout(function () { startOfflineSave(); checkVersion(); }, 4000);
      }).catch(function (message) {
        var m = String(message && message.message || message);
        console.error("createUnityInstance: " + m);
        startFailed(/memory|alloc|out of/i.test(m) ? "端末のメモリが足りません。ほかのアプリやタブを閉じて、もう一度開いてください。" : null);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
